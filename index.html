<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>REAVITA | Plataforma Inteligente de Reabilitação Física</title>
    <meta name="description" content="Plataforma inteligente de apoio à reabilitação física com inteligência artificial, evidências científicas, REAVITA CARE para pacientes e REAVITA PRO para fisioterapeutas e clínicas." />
    <meta property="og:title" content="REAVITA - Tecnologia a favor do movimento" />
    <meta property="og:description" content="Ciência e inteligência para acompanhar sua evolução em reabilitação física." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('reavita_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
